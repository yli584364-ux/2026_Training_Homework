name: C homework

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-homework-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    name: C homework / grade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the grader itself
        run: python3 -m unittest discover -s tests -p 'test_grader.py' -v

      - name: Compile and test C homework
        run: python3 scripts/check_homework.py --ci
